<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQP Beslisboom - Configuratiekeuze V1.2</title>
<!--
  CHANGELOG V1.2:
  ----------------
  [FEATURES]
  - Liftputkeuze uitgebreid: praktische indicatoren
    E08 (vibraties) vs E09 (standaard) in Stap 2
  - Belangrijk sectie: verdiepte E08/E09 toelichting
    met technisch mechanisme uitleg
  - Onderbouwing sectie: liftput vergelijkingstabel
    E08 vs E09 met alle relevante criteria
  - Config notes E08/E09 verrijkt met praktische
    voorbeelden en indicatoren

  CHANGELOG V1.1:
  ----------------
  [FEATURES]
  - 2K status badge per configuratie
    (optioneel/aanbevolen/verplicht/n.v.t.)
  - 4 collapsible secties op resultatenpagina:
    Checklist, Opmerkingen, Belangrijk, Onderbouwing
  - Belangrijk sectie: kritische aandachtspunten
  - Onderbouwing sectie: technische specs,
    systeemvergelijking, droogtijden, planning
  [STYLING]
  - UI/UX aligned met Sales Calculator V37.7
  - Calculator-style section headers (+/- toggle)
  - Iconen verwijderd uit checklist items
  - Verbeterde card styling, transitions
  [REFACTOR]
  - Data-structuur uitgebreid: 2K status,
    belangrijk arrays, onderbouwing data
  - Aparte render functies per sectie
  - Print CSS voor alle 4 secties

  CHANGELOG V1.0:
  ----------------
  [FEATURES]
  - Beslisboom met 4 stappen (ruimte, water,
    ondergrond, systeem)
  - 12 configuraties (E01-E12)
  - Interactieve checklist met progress tracking
  - PDF export via print dialog
  - Dark/light mode toggle
  - Breadcrumb navigatie
-->
<style>
/* ===== AQP DESIGN TOKENS ===== */
:root {
  --primary: #33b2d2;
  --primary-dark: #2a9bbf;
  --primary-hover: #2a9bbf;
  --primary-10: rgba(51,178,210,0.10);
  --primary-20: rgba(51,178,210,0.20);
  --success: #22c55e;
  --success-bg: rgba(34,197,94,0.12);
  --warning: #f59e0b;
  --warning-bg: rgba(245,158,11,0.12);
  --danger: #ef4444;
  --danger-bg: rgba(239,68,68,0.12);
  --bg: #1a1b1e;
  --card-bg: #25272b;
  --card-border: #2f3136;
  --text: #e5e5e5;
  --text-muted: #9ca3af;
  --input-bg: #2f3136;
  --dormant-bg: #1e2022;
  --dormant-border: #3c4043;
  --radius: clamp(10px,1.2vw,14px);
  --radius-sm: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --font: -apple-system, BlinkMacSystemFont,
          'Segoe UI', Roboto, sans-serif;
}

.light-mode {
  --bg: #f5f7fa;
  --card-bg: #ffffff;
  --card-border: #e2e8f0;
  --text: #2d3748;
  --text-muted: #718096;
  --input-bg: #edf2f7;
  --dormant-bg: #f8fafc;
  --dormant-border: #cbd5e0;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* ===== RESET & BASE ===== */
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
}

body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  transition: background 0.3s ease, color 0.3s ease;
}

/* ===== HEADER ===== */
.app-header {
  position: fixed; top: 0; left: 0; right: 0;
  height: 56px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  z-index: 100;
  gap: 16px;
  transition: background 0.3s ease;
}

.header-logo {
  height: 36px;
  width: auto;
  flex-shrink: 0;
}

.dark-mode .logo-light { display: none; }
.dark-mode .logo-dark { display: block; }
.logo-light { display: block; }
.logo-dark { display: none; }
.light-mode .logo-light { display: block; }
.light-mode .logo-dark { display: none; }

.header-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary);
  white-space: nowrap;
}
.header-sub {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
}

.header-spacer { flex: 1; }

.btn-theme {
  width: 36px; height: 36px;
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
}
.btn-theme:hover {
  border-color: var(--primary);
  color: var(--primary);
}

/* ===== MAIN CONTAINER ===== */
.main {
  max-width: 640px;
  margin: 0 auto;
  padding: 76px 20px 40px;
}

/* ===== PROGRESS BAR ===== */
.progress-wrap {
  margin-bottom: 28px;
}
.progress-steps {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}
.progress-step {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--input-bg);
  transition: background 0.4s ease;
}
.progress-step.done {
  background: var(--primary);
}
.progress-step.active {
  background: var(--primary-20);
}
.progress-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ===== STEP CARD ===== */
.step-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 28px 24px;
  box-shadow: var(--shadow);
  animation: fadeSlideIn 0.35s ease;
  transition: background 0.3s ease;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.step-number {
  font-size: 11px;
  font-weight: 700;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.step-question {
  font-size: clamp(18px, 3vw, 22px);
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.3;
}

.step-hint {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 20px;
  line-height: 1.5;
}

/* ===== OPTION BUTTONS ===== */
.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.opt-btn {
  display: flex;
  padding: 14px 16px;
  background: var(--input-bg);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.4;
  transition: all 0.2s ease;
  width: 100%;
}

.opt-btn:hover {
  border-color: var(--primary);
  background: var(--primary-10);
}

.opt-btn:active {
  transform: scale(0.98);
}

.opt-content { flex: 1; }

.opt-title {
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 2px;
}

.opt-desc {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.4;
}

/* ===== RESULT CARD ===== */
.result-card {
  background: var(--card-bg);
  border: 2px solid var(--primary);
  border-radius: var(--radius);
  padding: 0;
  box-shadow: var(--shadow),
    0 0 20px rgba(51,178,210,0.1);
  animation: fadeSlideIn 0.4s ease;
  overflow: hidden;
  transition: background 0.3s ease;
}

.result-header {
  background: var(--primary);
  color: #fff;
  padding: 20px 24px;
  text-align: center;
}
.result-code {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 1px;
}
.result-name {
  font-size: 14px;
  font-weight: 500;
  opacity: 0.9;
  margin-top: 2px;
}

.result-body {
  padding: 24px;
}

.result-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.result-item {
  padding: 10px 12px;
  background: var(--input-bg);
  border-radius: var(--radius-sm);
}
.result-item-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 2px;
}
.result-item-value {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.result-full {
  grid-column: 1 / -1;
}

.result-system {
  padding: 14px 16px;
  background: var(--primary-10);
  border-left: 4px solid var(--primary);
  border-radius: 0 var(--radius-sm)
    var(--radius-sm) 0;
  margin-bottom: 20px;
}
.result-system-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--primary);
  font-weight: 700;
  margin-bottom: 4px;
}
.result-system-value {
  font-size: 15px;
  font-weight: 600;
}

/* ===== 2K STATUS BADGE ===== */
.status-2k {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.status-2k-optioneel {
  background: var(--input-bg);
  color: var(--text-muted);
  border: 1px solid var(--card-border);
}
.status-2k-aanbevolen {
  background: var(--warning-bg);
  color: var(--warning);
  border: 1px solid rgba(245,158,11,0.3);
}
.status-2k-verplicht {
  background: var(--danger-bg);
  color: var(--danger);
  border: 1px solid rgba(239,68,68,0.3);
}
.status-2k-nvt {
  background: var(--success-bg);
  color: var(--success);
  border: 1px solid rgba(34,197,94,0.3);
}
.status-2k-maatwerk {
  background: var(--primary-10);
  color: var(--primary);
  border: 1px solid rgba(51,178,210,0.3);
}

.result-2k-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.result-2k-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.risk-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.risk-low {
  background: var(--success-bg);
  color: var(--success);
}
.risk-high {
  background: var(--danger-bg);
  color: var(--danger);
}
.risk-extreme {
  background: var(--warning-bg);
  color: var(--warning);
}

/* ===== BREADCRUMB / PATH ===== */
.path-wrap {
  margin-bottom: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.path-chip {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--primary-10);
  color: var(--primary);
  cursor: pointer;
  transition: all 0.2s;
}
.path-chip:hover {
  background: var(--primary-20);
}
.path-sep {
  color: var(--text-muted);
  font-size: 10px;
}

/* ===== ACTION BUTTONS ===== */
.actions {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}

.btn {
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-outline {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--card-border);
}
.btn-outline:hover {
  border-color: var(--primary);
  color: var(--primary);
}

/* ===== TEAMLEADER BADGE ===== */
.tl-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  background: var(--input-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm);
  margin-top: 16px;
}
.tl-badge-icon {
  font-size: 24px;
}
.tl-badge-text {
  font-size: 13px;
  line-height: 1.4;
}
.tl-badge-name {
  font-weight: 700;
  color: var(--primary);
}

/* ===== WARNING BOX ===== */
.warn-box {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  line-height: 1.5;
  margin-top: 16px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.warn-box-caution {
  background: var(--warning-bg);
  border: 1px solid rgba(245,158,11,0.3);
  color: var(--warning);
}
.warn-box-info {
  background: var(--primary-10);
  border: 1px solid rgba(51,178,210,0.3);
  color: var(--primary);
}
.warn-icon {
  font-size: 18px; flex-shrink: 0;
}

/* ===== CALCULATOR-STYLE SECTIONS ===== */
.aqp-section {
  margin-top: 16px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: background 0.3s ease;
}

.section-header {
  background: transparent;
  color: var(--text);
  padding: clamp(12px, 1.5vw, 16px) 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: clamp(15px, 2.5vw, 18px);
  font-weight: 600;
  transition: color 0.2s, background 0.2s;
  border: none;
  width: 100%;
  text-align: left;
  font-family: var(--font);
  user-select: none;
}
.section-header:hover {
  background: var(--primary-10);
}

.section-toggle::after {
  content: '+';
  font-size: clamp(16px, 2.5vw, 20px);
  font-weight: 600;
  color: var(--primary);
  display: inline-block;
  width: 20px;
  text-align: center;
}
.section-header.expanded .section-toggle::after {
  content: '-';
}

.section-header:hover .section-toggle::after {
  color: var(--primary-dark);
}

.section-label {
  flex: 1;
  color: var(--primary);
}
.section-meta {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  margin-left: auto;
}

.section-content {
  display: none;
  padding: 0 20px 20px;
}
.section-content.show {
  display: block;
}

/* ===== CHECKLIST (inside section) ===== */
.cl-group {
  margin-top: 16px;
}
.cl-group:first-child {
  margin-top: 4px;
}
.cl-group-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--primary);
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--card-border);
}
.cl-group-progress {
  float: right;
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
}

.cl-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  transition: opacity 0.2s ease;
}
.cl-item + .cl-item {
  border-top: 1px solid rgba(127,127,127,0.08);
}
.cl-item.cl-done {
  opacity: 0.55;
}
.cl-item.cl-done .cl-label {
  text-decoration: line-through;
  text-decoration-color: var(--primary);
}

.cl-check {
  width: 18px;
  height: 18px;
  margin-top: 1px;
  accent-color: var(--primary);
  flex-shrink: 0;
  cursor: pointer;
}

.cl-label {
  font-size: 13px;
  line-height: 1.4;
  flex: 1;
  color: var(--text);
  transition: opacity 0.2s;
}
.cl-label-hint {
  color: var(--text-muted);
  font-style: italic;
}

.cl-input {
  width: 80px;
  padding: 4px 8px;
  background: var(--input-bg);
  border: 1px solid var(--card-border);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  text-align: right;
}
.cl-input:focus {
  outline: none;
  border-color: var(--primary);
}
.cl-input.cl-filled {
  border-color: var(--primary);
  background: var(--primary-10);
}

.cl-unit {
  font-size: 12px;
  color: var(--text-muted);
  flex-shrink: 0;
  min-width: 24px;
  line-height: 26px;
}

.cl-notes-wrap {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--card-border);
}
.cl-notes-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--primary);
  margin-bottom: 8px;
}
.cl-notes {
  width: 100%;
  min-height: 80px;
  padding: 10px 12px;
  background: var(--input-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.5;
  resize: vertical;
}
.cl-notes:focus {
  outline: none;
  border-color: var(--primary);
}

/* Progress bar in section header */
.cl-progress-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.cl-progress-bar {
  width: 60px;
  height: 5px;
  background: var(--input-bg);
  border-radius: 3px;
  overflow: hidden;
}
.cl-progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  transition: width 0.3s ease;
}
.cl-progress-text {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  min-width: 36px;
  text-align: right;
}

/* Completion banner */
.cl-complete {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  margin-top: 16px;
  background: rgba(51, 178, 210, 0.1);
  border: 1px solid var(--primary);
  border-radius: var(--radius-sm);
  color: var(--primary);
  font-size: 13px;
  font-weight: 600;
}

/* ===== OPMERKINGEN/BELANGRIJK/ONDERBOUWING ===== */
.info-list {
  list-style: none;
  padding: 0;
}
.info-list li {
  position: relative;
  padding: 6px 0 6px 16px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
}
.info-list li + li {
  border-top: 1px solid rgba(127,127,127,0.08);
}
.info-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 13px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
}

/* Belangrijk: danger bullets */
.belangrijk-list li::before {
  background: var(--danger);
}
.belangrijk-list li {
  color: var(--text);
}
.belangrijk-group {
  margin-top: 14px;
}
.belangrijk-group:first-child {
  margin-top: 0;
}
.belangrijk-group-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--danger);
  margin-bottom: 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--card-border);
}

/* Onderbouwing tables */
.spec-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-top: 12px;
}
.spec-table:first-child {
  margin-top: 0;
}
.spec-table caption {
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--primary);
  padding-bottom: 6px;
}
.spec-table th {
  text-align: left;
  padding: 6px 8px;
  background: var(--input-bg);
  color: var(--text-muted);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  border-bottom: 1px solid var(--card-border);
}
.spec-table td {
  padding: 6px 8px;
  color: var(--text);
  border-bottom: 1px solid
    rgba(127,127,127,0.08);
}
.spec-table tr:last-child td {
  border-bottom: none;
}
.spec-table .highlight {
  color: var(--primary);
  font-weight: 600;
}

.spec-subtitle {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--primary);
  margin-top: 16px;
  margin-bottom: 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--card-border);
}
.spec-subtitle:first-child {
  margin-top: 4px;
}

.planning-step {
  display: flex;
  gap: 10px;
  padding: 6px 0;
  font-size: 13px;
  line-height: 1.4;
}
.planning-step + .planning-step {
  border-top: 1px solid rgba(127,127,127,0.08);
}
.planning-day {

        'voor liftputten zonder vibraties');

        'scheuren dicht bij vochtcontact (tot 0,4mm)');

        'lift, residentieel, lage frequentie');

        'zelfde dag worden aangebracht');
      lp.push('Curing: 3 dagen regelmatig nat sprayen');
    }
    groups.push({
      title: 'Liftput', items: lp
    });
  }

  /* GARAGE specifiek */
  if (f.garage) {
    var ga = [];
    ga.push('Slijtvaste/antislip coating VERPLICHT ' +
      '(mechanische belasting voertuigen)');
    ga.push('Primer voor slijtlaag: Asodur SG3 ' +
      '(kelder) of GBM (bovengronds)');
    ga.push('Coating pas aanbrengen na volledige ' +
      'droging dichtingssysteem');
    groups.push({
      title: 'Garage', items: ga

  if (!f.liftput) {
    var pp = [];

      'opvullen mogelijk');
    pp.push('Alleen binnenafdichting: ' +

    pp.push('Bij twijfel: ALTIJD behouden');

  return groups;
}

    afm.push({ type:'input',
      label:'Vloeroppervlakte', unit:'m\u00B2' });
    afm.push({ type:'input',
      label:'Wandoppervlakte', unit:'m\u00B2' });

      label:'Vloeroppervlakte put', unit:'m\u00B2' });

/* ===== CHECKLIST STATE ===== */
var clState = {};

function getClId(g, i) { return 'cl_' + g + '_' + i; }

/* ===== RENDER SECTION: CHECKLIST ===== */
function renderChecklistSection(code) {
  var groups = buildChecklist(code);
  if (groups.length === 0) return '';

  var total = 0;
  for (var g = 0; g < groups.length; g++) {
    total += groups[g].items.length;
  }

  if (!clState[code]) {
    clState[code] = {
      checks: {}, inputs: {}, notes: ''
    };
  }
  var cs = clState[code];

  var checked = 0;
  for (var k in cs.checks) {
    if (cs.checks[k]) checked++;
  }
  var pct = total > 0
    ? Math.round(checked / total * 100) : 0;

  /* Section wrapper */
  var html = '<div class="aqp-section" ' +
    'id="sec-checklist">';

  /* Header - Calculator style */
  html += '<button type="button" class="section-header' +
    (sectionState.checklist ? ' expanded' : '') +
    '" onclick="toggleSection(\'checklist\')">' +
    '<span class="section-toggle"></span>' +
    '<span class="section-label">' +
    'Checklist Plaatsbezoek</span>' +
    '<div class="cl-progress-wrap">' +
    '<div class="cl-progress-bar">' +
    '<div class="cl-progress-fill" ' +
    'style="width:' + pct + '%"></div></div>' +
    '<span class="cl-progress-text">' +
    checked + '/' + total + '</span></div>' +
    '</button>';

  /* Content */
  html += '<div class="section-content' +
    (sectionState.checklist ? ' show' : '') +
    '" id="content-checklist">';

  var idx = 0;
  for (var g = 0; g < groups.length; g++) {
    var grp = groups[g];
    var gChecked = 0;
    var gTotal = grp.items.length;
    for (var i = 0; i < gTotal; i++) {
      var gid = getClId(g, i);
      if (cs.checks[gid]) gChecked++;
    }

    html += '<div class="cl-group">';
    html += '<div class="cl-group-title">' +
      grp.title +
      '<span class="cl-group-progress">' +
      gChecked + '/' + gTotal + '</span></div>';

    for (var i = 0; i < grp.items.length; i++) {
      var it = grp.items[i];
      var id = getClId(g, i);
      var isDone = cs.checks[id] || false;
      var val = cs.inputs[id] || '';

      html += '<div class="cl-item' +
        (isDone ? ' cl-done' : '') +
        '" id="row_' + id + '">';

      html += '<input type="checkbox" ' +
        'class="cl-check"' +
        (isDone ? ' checked' : '') +
        " onchange=\"clCheck('" + code +
        "','" + id + "',this.checked)\">";

      html += '<span class="cl-label">' +
        it.label;
      if (it.hint) {
        html += ' <span class="cl-label-hint">(' +
          it.hint + ')</span>';
      }
      html += '</span>';

      if (it.type === 'input') {
        html += '<input type="text" class="cl-input' +
          (val ? ' cl-filled' : '') + '"' +
          ' value="' + escHtml(val) + '"' +
          ' placeholder="..."' +
          " onchange=\"clInput('" + code +
          "','" + id + "',this.value)\"" +
          " oninput=\"this.classList.toggle(" +
          "'cl-filled',this.value.length>0)\">";
        html += '<span class="cl-unit">' +
          it.unit + '</span>';
      }
      html += '</div>';
      idx++;
    }
    html += '</div>';
  }

  if (checked === total && total > 0) {
    html += '<div class="cl-complete">' +
      '&#9989; Checklist compleet</div>';
  }

  html += '<div class="cl-notes-wrap">';
  html += '<div class="cl-notes-label">' +
    'Opmerkingen plaatsbezoek</div>';
  html += '<textarea class="cl-notes" ' +
    'placeholder="Bijkomende opmerkingen, ' +
    'foto-referenties, bijzonderheden..."' +
    " onchange=\"clNotes('" + code +
    "',this.value)\">" +
    escHtml(cs.notes) + '</textarea>';
  html += '</div>';

  html += '</div></div>';
  return html;
}

/* ===== SECTION TOGGLE STATE ===== */
var sectionState = {
  checklist: false,
  opmerkingen: false,
  belangrijk: false,
  onderbouwing: false
};

function toggleSection(name) {
  sectionState[name] = !sectionState[name];
  var hdr = document.querySelector(
    '#sec-' + name + ' .section-header');
  var cnt = document.getElementById(
    'content-' + name);
  if (hdr) {
    if (sectionState[name]) {
      hdr.classList.add('expanded');
    } else {
      hdr.classList.remove('expanded');
    }
  }
  if (cnt) {
    if (sectionState[name]) {
      cnt.classList.add('show');
    } else {
      cnt.classList.remove('show');
    }
  }
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ===== CHECKLIST ACTIONS ===== */
function clCheck(code, id, val) {
  if (!clState[code]) {
    clState[code] = {
      checks:{}, inputs:{}, notes:''
    };
  }
  clState[code].checks[id] = val;

  var row = document.getElementById('row_' + id);
  if (row) {
    if (val) row.classList.add('cl-done');
    else row.classList.remove('cl-done');
  }
  updateClProgress(code);
}

function clInput(code, id, val) {
  if (!clState[code]) {
    clState[code] = {
      checks:{}, inputs:{}, notes:''
    };
  }
  clState[code].inputs[id] = val;
}

function clNotes(code, val) {
  if (!clState[code]) {
    clState[code] = {
      checks:{}, inputs:{}, notes:''
    };
  }
  clState[code].notes = val;
}

function updateClProgress(code) {
  var cs = clState[code];
  if (!cs) return;

  var checks = document.querySelectorAll(
    '#sec-checklist .cl-check');
  var total = checks.length;
  var checked = 0;
  for (var k in cs.checks) {
    if (cs.checks[k]) checked++;
  }
  var pct = total > 0
    ? Math.round(checked / total * 100) : 0;

  var fill = document.querySelector(
    '.cl-progress-fill');
  if (fill) fill.style.width = pct + '%';

  var txt = document.querySelector(
    '.cl-progress-text');
  if (txt) txt.textContent = checked + '/' + total;

  var titles = document.querySelectorAll(
    '.cl-group-progress');
  var groups = document.querySelectorAll('.cl-group');
  for (var g = 0; g < groups.length; g++) {
    var items = groups[g].querySelectorAll(
      '.cl-check');
    var gc = 0;
    for (var i = 0; i < items.length; i++) {
      if (items[i].checked) gc++;
    }
    if (titles[g]) {
      titles[g].textContent =
        gc + '/' + items.length;
    }
  }
}

/* ===== PDF EXPORT ===== */
function exportPDF() {
  var sub = document.getElementById('printSub');
  if (sub && state.result) {
    var c = CONFIGS[state.result];
    var d = new Date();
    var dd = String(d.getDate()).padStart(2,'0');
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var yy = d.getFullYear();
    sub.textContent = (c ? c.code + ' - ' +
      c.name + ' | ' : '') +
      'Plaatsbezoek ' + dd + '/' + mm + '/' + yy;
  }

  /* Force all sections open for print */
  var sections = document.querySelectorAll(
    '.section-content');
  var states = [];
  for (var i = 0; i < sections.length; i++) {
    states.push(
      sections[i].classList.contains('show'));
    sections[i].classList.add('show');
  }
  var headers = document.querySelectorAll(
    '.section-header');
  var hStates = [];
  for (var i = 0; i < headers.length; i++) {
    hStates.push(
      headers[i].classList.contains('expanded'));
    headers[i].classList.add('expanded');
  }

  window.print();

  /* Restore states */
  for (var i = 0; i < sections.length; i++) {
    if (!states[i]) {
      sections[i].classList.remove('show');
    }
  }
  for (var i = 0; i < headers.length; i++) {
    if (!hStates[i]) {
      headers[i].classList.remove('expanded');
    }
  }
}

/* ===== APP STATE ===== */
var state = {
  step: 0,
  waterklasse: null,
  ruimte: null,
  ondergrond: null,
  systeem: null,
  result: null,
  path: []
};

var app = document.getElementById('app');

/* ===== RENDER ENGINE ===== */
function render() {
  var html = '';

  /* Path breadcrumbs */
  if (state.path.length > 0) {
    html += '<div class="path-wrap">';
    for (var i = 0; i < state.path.length; i++) {
      if (i > 0)
        html +=
          '<span class="path-sep">&#9656;</span>';
      html += '<span class="path-chip" ' +
        'onclick="goBack(' + i + ')">' +
        state.path[i].label + '</span>';
    }
    html += '</div>';
  }

  /* Progress bar */
  var totalSteps = getTotalSteps();
  html += '<div class="progress-wrap">';
  html += '<div class="progress-steps">';
  for (var s = 0; s < totalSteps; s++) {
    var cls = s < state.step ? 'done' :
      (s === state.step ? 'active' : '');
    html += '<div class="progress-step ' +
      cls + '"></div>';
  }
  html += '</div>';
  html += '<div class="progress-label">Stap ' +
    (state.step + 1) + ' van ' +
    totalSteps + '</div>';
  html += '</div>';

  /* Current step */
  switch (state.step) {
    case 0: html += renderStep0(); break;
    case 1: html += renderStep1(); break;
    case 2: html += renderStep2(); break;
    case 3: html += renderStep3(); break;
    case 99: html += renderResult(); break;
  }

  app.innerHTML = html;
}

function getTotalSteps() {
  if (state.result) return state.step;
  if (state.ruimte === 'liftput') return 2;
  if (state.ruimte === 'garage') return 2;
  if (state.waterklasse === 'W2.2') return 2;
  if (state.waterklasse === 'W2.1' &&
      state.ondergrond === 'beton') return 4;
  return 3;
}

  render();
}

function setOndergrond(o) {
  state.ondergrond = o;
  var labels = {
    beton:'Beton', metselwerk:'Metselwerk',
    mix:'Mix'
  };
  state.path.push({ label: labels[o], step: 2 });

  if (state.waterklasse === 'W1') {
    if (o === 'beton') state.result = 'E01';
    else if (o === 'metselwerk')
      state.result = 'E02';
    else state.result = 'E03';
    state.step = 99;
  } else if (state.waterklasse === 'W2.1') {
    if (o === 'beton') {
      state.step = 3;
    } else if (o === 'metselwerk') {
      state.result = 'E06';
      state.step = 99;
    } else {
      state.result = 'E07';
      state.step = 99;
    }
  }
  render();
}

function setSysteem(s) {
  state.systeem = s;
  state.path.push({ label: s, step: 3 });
  state.result = s === '1K' ? 'E04' : 'E05';
  state.step = 99;
  render();
}

function goBack(pathIndex) {
  var target = state.path[pathIndex];
  state.step = target.step;
  state.path = state.path.slice(0, pathIndex);
  state.result = null;

  if (target.step <= 0) {
    state.ruimte = null;
    state.waterklasse = null;
    state.ondergrond = null;
    state.systeem = null;
  }
  if (target.step <= 1) {
    state.waterklasse = null;
    state.ondergrond = null;
    state.systeem = null;
  }
  if (target.step <= 2) {
    state.ondergrond = null;
    state.systeem = null;
  }
  if (target.step <= 3) {
    state.systeem = null;
  }
  render();
}

function resetAll() {
  state = {
    step: 0, waterklasse: null, ruimte: null,
    ondergrond: null, systeem: null,
    result: null, path: []
  };
  /* Reset section states */
  sectionState = {
    checklist: false, opmerkingen: false,
    belangrijk: false, onderbouwing: false
  };
  render();
}

/* ===== INIT ===== */
render();
</script>
